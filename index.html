<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="icon" type="image/png" href="soul.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        body {
            font-family: 'Press Start 2P', Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: black;
            color: white;
        }

        /* ひらがなに対してピクセルフォント風を適用 */
        #warningScreen {
            display: block;
            text-align: center;
            padding: 60px 80px;
        }

        #warningScreen h1 {
            font-size: 36px;
            margin-bottom: 40px;
            font-family: 'DotGothic16', 'Press Start 2P', Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 2px;
        }

        #warningScreen p {
            font-size: 24px;
            line-height: 2;
            margin-bottom: 60px;
            font-family: 'DotGothic16', 'Press Start 2P', Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 1px;
        }

        @keyframes growFrisk {
            0% {
                font-size: 100px;
            }
            100% {
                font-size: 200px;
            }
        }

        #characterName {
            font-size: 200px;
            margin: 96px 0;
            font-weight: bold;
            animation: growFrisk 15s ease-in-out forwards;
        }

        .yes-button {
            background: none;
            color: white;
            border: none;
            padding: 0;
            font-size: 24px;
            font-family: 'DotGothic16', 'Press Start 2P', Arial, sans-serif;
            cursor: pointer;
            transition: all 0.1s;
            letter-spacing: 1px;
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .yes-button:active {
            transform: scale(0.95);
        }

        /* キャラ選択画面 */
        #characterScreen {
            display: none;
        }

        #characterScreen.active {
            display: block;
        }

        .link-container {
            margin: 20px 0;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 0;
            background: none;
            color: white;
            text-decoration: none;
            border-radius: 0;
            font-size: 24px;
            transition: all 0.1s;
        }

        a:hover {
            transform: scale(1.1);
        }

        h1 {
            color: white;
            font-size: 16px;
        }

        .menu1 {
            height: 200px;
        }

        .menu2 {
           height: 300px;
        }
    </style>
</head>

<audio src="music/Startmenu.mp3" autoplay loop muted playsinline></audio>

    <!-- 警告画面 -->
    <div id="warningScreen">
        <h1>けいこく：このなまえは<br>じごくへの　いりぐち・・・<br>
        このままはじめますか？</h1>

        <h1 id="characterName">フリスク</h1>
        <button class="yes-button" id="yesButton">はい</button>
    </div>

    <!-- キャラ選択画面 -->
    <div id="characterScreen">
        <img class="menu1" src="material/menu1.png">
        <h1>フリスク　　LV10　　102:27</h1>
        <div class="link-container">
            <a href="sans/sans.html">Sans</a>
            <a href="papyrus/papyrus.html">Papyrus</a>
            <a href="undyne/undyne.html">Undyne</a>
        <img class="menu2" src="material/menu2.png">
        </div>
    </div>

    <script>
        // ミュート状態で自動再生 → 再生後にミュート解除（自動再生ブロック対策）
        window.addEventListener('load', function () {
            var audio = document.querySelector('audio');
            audio.play().then(function () {
                audio.muted = false;
            }).catch(function () {
                // 自動再生がブロックされた場合、最初のクリックで再生
                document.addEventListener('click', function () {
                    audio.muted = false;
                    audio.play();
                }, { once: true });
            });
        });

        // はいボタンクリックイベント
        document.getElementById('yesButton').addEventListener('click', function () {
            var nameEl = document.getElementById('characterName');
            if (nameEl) {
                nameEl.style.animation = 'none';
            }
            document.getElementById('warningScreen').style.display = 'none';
            document.getElementById('characterScreen').classList.add('active');
        });
    </script>
</body>
</html>
